name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # Includes the type check and the prerender.
      - run: npm run build
      - run: npm run check:budget
      # Mobile Lighthouse against the production build: LCP 2.5 s, CLS 0.1, TBT 200 ms floors.
      # Runners have no GPU, so this measures the HTML experience; the 3D is skipped on
      # software WebGL by design (src/app/capabilities.ts).
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
